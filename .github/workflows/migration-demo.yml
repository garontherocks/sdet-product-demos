name: Playwright Migration demo

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: migration-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run quality
      - run: npm run test:migration
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/migration-results.json
      - run: npm run validate:migration
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-migration-demo-evidence
          path: |
            artifacts
            evidence/migration
          retention-days: 30
