name: Bootstrap demo
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: bootstrap-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run quality
      - run: npm run test:bootstrap
      - run: npm run metrics
        if: always() && hashFiles('artifacts/results.json') != ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootstrap-demo-evidence
          path: |
            artifacts
            evidence/bootstrap
          retention-days: 30
